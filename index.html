<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QRate</title>
  <meta name="description" content="QR-Etiketten für Kisten: scannen und sehen, was drin ist.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="QRate">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <button id="back" class="icon-btn" hidden aria-label="Zurück"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="top-text">
      <h1 id="title">QRate</h1>
      <p id="subtitle"></p>
    </div>
  </header>

  <main id="main" class="stack"><p class="loading">Lädt …</p></main>

  <nav class="tabs" aria-label="Hauptnavigation">
    <button data-tab="home" data-route=""><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5V20H3z"/><path d="M9.5 20v-5h5v5"/></svg><span>Übersicht</span></button>
    <button data-tab="search" data-route="suche"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg><span>Suche</span></button>
    <button data-tab="scan" data-route="scan" class="tab-scan"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M9 9h2v2H9zM13 13h2v2h-2zM13 9h2M9 13v2"/></svg><span>Scannen</span></button>
    <button data-tab="labels" data-route="etiketten"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h3v4H7zM13 10h4M13 14h3"/></svg><span>Etiketten</span></button>
    <button data-tab="house" data-route="haushalt"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/><circle cx="17" cy="8" r="2.5"/><path d="M16 13.2c2.4 0 4 1.4 4.5 4"/></svg><span>Haushalt</span></button>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="vendor/supabase.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
